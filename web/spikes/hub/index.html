<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hub render spike</title>
    <style>
      html, body { margin: 0; height: 100%; background: #11131a; color: #eee; font: 13px system-ui, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
      #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .label { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; border-radius: 4px; padding: 2px 6px;
        background: rgba(17, 19, 26, 0.78); color: #fff; font: 600 12px system-ui, sans-serif; white-space: nowrap; will-change: transform; }
      .label.enterable { background: #2f3c58; outline: 1px solid #ffe066; }
      #hud { position: fixed; left: 6px; top: 6px; margin: 0; padding: 4px 6px; background: rgba(0, 0, 0, 0.6); font: 11px/1.35 ui-monospace, monospace; pointer-events: none; }
      #places { position: fixed; right: 6px; bottom: 6px; max-width: 46vw; background: rgba(17, 19, 26, 0.85); border-radius: 6px; padding: 4px 8px; }
      #places ul { list-style: none; margin: 4px 0; padding: 0; }
      #places button { background: none; border: 0; color: #9fd0ff; padding: 3px 0; font: inherit; text-align: left; cursor: pointer; }
      #interior { position: fixed; inset: 10% 6%; background: #1d2230; border: 2px solid #ffe066; border-radius: 10px; padding: 16px 18px; overflow: auto; }
      #interior h2 { margin: 0 0 8px; font-size: 20px; }
      #interior button { font: inherit; padding: 8px 14px; margin: 6px 6px 0 0; border-radius: 6px; border: 0; background: #3a4766; color: #fff; }
      #toast { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); padding: 8px 12px; border-radius: 6px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="labels"></div></div>
    <pre id="hud" aria-hidden="true">loading…</pre>
    <details id="places">
      <summary>Places</summary>
      <ul id="place-list"></ul>
    </details>
    <div id="interior" role="dialog" aria-modal="true" aria-labelledby="interior-title" hidden>
      <h2 id="interior-title">Council chamber</h2>
      <p>The interior of a place opens as a DOM overlay over the paused hub (DEC-079): text, lists and controls are ordinary accessible HTML.</p>
      <p><strong>Whip count</strong> (placeholder): 7 for, 5 against, 3 undecided.</p>
      <button type="button">Declare vote (stub)</button>
      <button type="button" id="interior-close">Leave</button>
    </div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
