[package]
name = "mandate-seeds"
version = "0.1.0"
edition = "2024"
description = "Dev-only: test seeds that are cached in tests/seeds.json and found again when the world changes"

[dependencies]
mandate-content = { version = "0.1.0", path = "../mandate-content", features = ["fs"] }
mandate-protocol = { version = "0.1.0", path = "../mandate-protocol" }
mandate-sim = { version = "0.1.0", path = "../mandate-sim" }
mandate-worldgen = { version = "0.1.0", path = "../mandate-worldgen" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
