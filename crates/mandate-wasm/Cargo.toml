[package]
name = "mandate-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
mandate-content = { version = "0.1.0", path = "../mandate-content", features = ["embedded"] }
mandate-core = { version = "0.1.0", path = "../mandate-core" }
mandate-protocol = { version = "0.1.0", path = "../mandate-protocol" }
mandate-save = { version = "0.1.0", path = "../mandate-save" }
mandate-sim = { version = "0.1.0", path = "../mandate-sim" }
mandate-worldgen = { version = "0.1.0", path = "../mandate-worldgen" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# The content workbench (dev builds only; the release WASM is built without it).
dev-tools = ["mandate-protocol/dev-tools"]
