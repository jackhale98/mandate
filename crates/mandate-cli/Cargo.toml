[package]
name = "mandate-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
mandate-content = { version = "0.1.0", path = "../mandate-content", features = ["fs"] }
mandate-core = { version = "0.1.0", path = "../mandate-core" }
mandate-protocol = { version = "0.1.0", path = "../mandate-protocol" }
mandate-save = { version = "0.1.0", path = "../mandate-save" }
mandate-seeds = { version = "0.1.0", path = "../mandate-seeds" }
mandate-sim = { version = "0.1.0", path = "../mandate-sim", features = ["explain"] }
mandate-worldgen = { version = "0.1.0", path = "../mandate-worldgen" }
miniz_oxide = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
