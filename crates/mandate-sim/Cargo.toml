[package]
name = "mandate-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
mandate-content = { version = "0.1.0", path = "../mandate-content" }
mandate-core = { version = "0.1.0", path = "../mandate-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
mandate-content = { path = "../mandate-content", features = ["fs"] }
proptest = "1.12.0"

[lints]
workspace = true

[features]
# The content workbench's explanations (`explain`): the lab and dev builds
# only, so the release engine compiles exactly as without them.
explain = []
