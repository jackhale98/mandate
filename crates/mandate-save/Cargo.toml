[package]
name = "mandate-save"
version = "0.1.0"
edition = "2024"

[dependencies]
mandate-core = { version = "0.1.0", path = "../mandate-core" }
mandate-sim = { version = "0.1.0", path = "../mandate-sim" }
miniz_oxide = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
