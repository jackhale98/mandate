[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

# Tests run years of simulation; unoptimised they took about 13 minutes. opt-level 1
# cuts the slowest suites about 7x and keeps debug assertions and overflow checks
# (no fast-math in Rust, so results are unchanged; DEC-041). `cargo test` inherits it.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "s"
