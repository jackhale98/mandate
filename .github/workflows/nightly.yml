name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Monte Carlo health sweep across every canonical world (DEC-059).
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: ["", industrial-decline, wealthy-coast, tech-growth, drought-farmland, resource-frontier]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Sweep ${{ matrix.preset || 'none' }}
        run: |
          ARGS="--seeds 32 --years 30"
          if [ -n "${{ matrix.preset }}" ]; then ARGS="$ARGS --preset ${{ matrix.preset }}"; fi
          cargo run -q --release -p mandate-cli -- sweep $ARGS > sweep.json || (cat sweep.json; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.preset || 'none' }}
          path: sweep.json
          retention-days: 14

  long-property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
        env:
          PROPTEST_CASES: "256"
