name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Least privilege; nothing here needs more than reading the code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Monte Carlo health sweep across every canonical world (DEC-059).
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ["", industrial_decline, wealthy_coast, tech_growth, drought_farmland, resource_frontier]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Sweep ${{ matrix.scenario || 'none' }}
        run: |
          ARGS="--seeds 32 --years 30"
          if [ -n "${{ matrix.scenario }}" ]; then ARGS="$ARGS --scenario ${{ matrix.scenario }}"; fi
          cargo run -q --release -p mandate-cli -- sweep $ARGS > sweep.json || (cat sweep.json; exit 1)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sweep-${{ matrix.scenario || 'none' }}
          path: sweep.json
          retention-days: 14

  # Bot-player tournament (M4): no dominant strategy, effort matters, idle
  # rarely wins, corruption does not dominate, the best routine differs
  # across worlds (DEC-077 §5), exploring early pays and exploring alone
  # never wins (DEC-091). The omniscient baseline shows what knowledge is worth.
  bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tournament
        run: cargo run -q --release -p mandate-cli -- bots --seeds 32 > bots.json || (cat bots.json; exit 1)
      - name: Omniscient baseline (DEC-091 lab switch)
        run: cargo run -q --release -p mandate-cli -- bots --seeds 32 --omniscient > bots-omniscient.json || (cat bots-omniscient.json; exit 1)
      # The simulation audit's two cheapest checks (SIMULATION_AUDIT.md,
      # "Nightly gate"): unemployment hurts incumbents, rent follows vacancy,
      # migration follows jobs; no policy template with a wrong-sign effect.
      # Non-blocking until the audit's fixes land.
      - name: Simulation audit gate (non-blocking)
        continue-on-error: true
        run: |
          status=0
          cargo run -q --release -p mandate-cli -- audit gate > audit-gate.json || status=$?
          cat audit-gate.json
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bots
          path: |
            bots.json
            bots-omniscient.json
          retention-days: 14

  long-property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --release
        env:
          PROPTEST_CASES: "256"
