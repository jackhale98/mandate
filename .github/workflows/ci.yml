name: CI

# A push that changes only documentation starts no run, and so cancels none
# (the concurrency group below cancels the run in progress on every push that
# does start one). The checks read no Markdown outside these paths.
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it asks for more.
# Nothing here uses repository secrets; pull requests from forks get a
# read-only token and no secrets by default, and this workflow never uses
# pull_request_target. Third-party actions are pinned to a commit sha (the
# version is in the comment); bump them deliberately, or with Dependabot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  # A push to main that fast-forwards to a commit which already passed this
  # workflow on a branch is the same code, byte for byte: main then only builds
  # and deploys. Anything else on main (a direct push) runs every check.
  verified:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=30" \
              --jq '[.workflow_runs[] | select(.head_branch != "main")] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then ok=true; fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Already verified on a branch: $ok"

  # Build the engine to WASM once; cached by a hash of every input (DEC-066).
  wasm:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: key
        run: echo "key=engine-pkg-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'content/**', 'scripts/build-wasm.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            web/src/engine/pkg
            target/wasm-node
          key: ${{ steps.key.outputs.key }}
      # Rebuild on a miss, or if a restored cache lacks either output (both the
      # web package and the Node build used by the parity check are required).
      - id: need
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] \
            || [ ! -f web/src/engine/pkg/mandate_wasm.js ] \
            || [ ! -f target/wasm-node/mandate_wasm.js ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.need.outputs.build == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - if: steps.need.outputs.build == 'true'
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - if: steps.need.outputs.build == 'true'
        run: ./scripts/build-wasm.sh
      - name: Both engine builds are present
        run: test -f web/src/engine/pkg/mandate_wasm.js && test -f target/wasm-node/mandate_wasm.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-pkg
          path: |
            web/src/engine/pkg
            target/wasm-node
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    needs: [wasm, verified]
    if: needs.verified.outputs.ok != 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Content validation
        run: cargo run -q -p mandate-cli -- content validate
      - name: Generated files are up to date (schemas, TS protocol types)
        run: |
          cargo run -q -p mandate-cli -- content schema
          git diff --exit-code content/schemas web/src/engine/protocol

  # The lab's checks, on a release build, beside the test suite (which is the
  # longer of the two): seeds, determinism, the sweep, the bots, parity.
  lab:
    runs-on: ubuntu-latest
    needs: [wasm, verified]
    if: needs.verified.outputs.ok != 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lab
      - name: Test seeds are fresh (tests/seeds.json)
        run: cargo run -q --release -p mandate-cli -- seeds check
      - name: Determinism (twice + save/load/continue)
        run: cargo run -q --release -p mandate-cli -- determinism --seed 2026 --turns 80
      - name: Monte Carlo health (quick)
        run: cargo run -q --release -p mandate-cli -- sweep --seeds 8 --years 20 > /dev/null
      - name: Bot players (the gate ladder, DEC-097 balance principle; ENGAGEMENT §7.2)
        run: cargo run -q --release -p mandate-cli -- bots --seeds 16 > bots.json || (cat bots.json; exit 1)
      # TODO(content workbench): make this blocking (add --strict, drop
      # continue-on-error) once the doctor reports no errors on the base pack.
      - name: Content doctor (report only, non-blocking)
        continue-on-error: true
        run: cargo run -q --release -p mandate-cli -- content doctor --seeds 8 --years 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engine-pkg
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Native = WASM parity (TEST-001)
        run: |
          NATIVE=$(cargo run -q --release -p mandate-cli -- run --seed 777 --size medium --turns 60 --hash-only)
          node scripts/wasm-parity.mjs 777 60 "$NATIVE"

  web:
    runs-on: ubuntu-latest
    needs: [wasm, verified]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engine-pkg
          path: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - if: needs.verified.outputs.ok != 'true'
        run: npm run typecheck
      - if: needs.verified.outputs.ok != 'true'
        run: npm run lint
      - if: needs.verified.outputs.ok != 'true'
        run: npm test
      # The pixel-art tool (DEC-084): typecheck (with web's TypeScript) and its own tests, goldens included.
      - name: Pixel-art tool
        if: needs.verified.outputs.ok != 'true'
        working-directory: tools/pixelkit
        run: npm run check
      # The site (DEC-083): the landing page at the base, the game at play/.
      - run: npm run build
      # Throwaway rendering prototype (DEC-050), published unlinked at /spike-hub/
      # for checks on a real phone. Built after the app so it is never precached.
      - run: npx vite build --config spikes/hub/vite.config.ts --outDir ../../dist/spike-hub --emptyOutDir
      - name: Site layout and landing-page budget
        run: |
          for f in index.html sw.js og.png play/index.html play/sw.js play/manifest.webmanifest spike-hub/index.html; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          # Landing HTML + CSS + JS, gzipped, excluding images: at most 60 KB.
          size=$(cat dist/index.html dist/assets/index-*.css dist/assets/index-*.js | gzip -9 | wc -c)
          echo "landing page: $size bytes gzipped"
          test "$size" -le 61440
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # The browser tests, a quarter of the suite on each of four machines (the
  # whole suite on one took 24 minutes, 2026-11-25). Each builds the site
  # itself, so the shards start beside the web job and not after it.
  e2e:
    runs-on: ubuntu-latest
    needs: [wasm, verified]
    if: needs.verified.outputs.ok != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engine-pkg
          path: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vite build --config spikes/hub/vite.config.ts --outDir ../../dist/spike-hub --emptyOutDir
      - name: Playwright browsers (cached)
        id: pw
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test --trace off --shard=${{ matrix.shard }}/4

  # Dependency advisories (SECURITY_REVIEW.md). Report only for now, so a new
  # advisory in a dev tool cannot block a deploy.
  # TODO(security): make this blocking (drop continue-on-error) before the
  # first public or store release, once `npm audit --omit=dev` and
  # `cargo audit` are clean and any accepted advisory is listed in
  # .cargo/audit.toml (or an npm override) with a reason.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (shipped dependencies, high and above)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (everything, including build tools; report only)
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=high
      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # Deploy main to GitHub Pages (DEC-064): the landing page at the base, the game
  # at play/, the hub spike at spike-hub/ (DEC-083), all from the web-dist artifact.
  deploy:
    # Runs when the checks passed here, or were skipped because this commit already passed on a branch.
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.web.result == 'success' &&
      (needs.verified.outputs.ok == 'true' ||
       (needs.rust.result == 'success' && needs.lab.result == 'success' && needs.e2e.result == 'success'))
    needs: [verified, rust, lab, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # Only to delete this run's own stale Pages artifact (the first step).
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # A re-run of this job uploads a second "github-pages" artifact to the
      # same run, and deploy-pages refuses a run that has two ("Multiple
      # artifacts named github-pages"). Remove any left by an earlier attempt.
      - name: Remove Pages artifacts left by an earlier attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
      # deploy-pages lists the run's artifacts at once, and the list can lag
      # the upload by a moment ("No artifacts named github-pages were found",
      # 0.3 s after the upload finished, 2026-11-23).
      - name: Let the artifact list catch up
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
