name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  # Build the engine to WASM once; cached by a hash of every input (DEC-066).
  wasm:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=engine-pkg-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'content/**', 'scripts/build-wasm.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            web/src/engine/pkg
            target/wasm-node
          key: ${{ steps.key.outputs.key }}
      # Rebuild on a miss, or if a restored cache lacks either output (both the
      # web package and the Node build used by the parity check are required).
      - id: need
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] \
            || [ ! -f web/src/engine/pkg/mandate_wasm.js ] \
            || [ ! -f target/wasm-node/mandate_wasm.js ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.need.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - if: steps.need.outputs.build == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - if: steps.need.outputs.build == 'true'
        run: ./scripts/build-wasm.sh
      - name: Both engine builds are present
        run: test -f web/src/engine/pkg/mandate_wasm.js && test -f target/wasm-node/mandate_wasm.js
      - uses: actions/upload-artifact@v4
        with:
          name: engine-pkg
          path: |
            web/src/engine/pkg
            target/wasm-node
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Content validation
        run: cargo run -q -p mandate-cli -- content validate
      - name: Generated files are up to date (schemas, TS protocol types)
        run: |
          cargo run -q -p mandate-cli -- content schema
          git diff --exit-code content/schemas web/src/engine/protocol
      - name: Determinism (twice + save/load/continue)
        run: cargo run -q --release -p mandate-cli -- determinism --seed 2026 --turns 80
      - name: Monte Carlo health (quick)
        run: cargo run -q --release -p mandate-cli -- sweep --seeds 8 --years 20 > /dev/null
      - name: Bot players (no dominant strategy; variety, DEC-077 §5; exploring pays, alone never wins, DEC-091)
        run: cargo run -q --release -p mandate-cli -- bots --seeds 16 > bots.json || (cat bots.json; exit 1)
      # TODO(content workbench): make this blocking (add --strict, drop
      # continue-on-error) once the doctor reports no errors on the base pack.
      - name: Content doctor (report only, non-blocking)
        continue-on-error: true
        run: cargo run -q --release -p mandate-cli -- content doctor --seeds 8 --years 2
      - uses: actions/download-artifact@v4
        with:
          name: engine-pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native = WASM parity (TEST-001)
        run: |
          NATIVE=$(cargo run -q --release -p mandate-cli -- run --seed 777 --size medium --turns 60 --hash-only)
          node scripts/wasm-parity.mjs 777 60 "$NATIVE"

  web:
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-pkg
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The pixel-art tool (DEC-084): typecheck (with web's TypeScript) and its own tests, goldens included.
      - name: Pixel-art tool
        working-directory: tools/pixelkit
        run: npm run check
      # The site (DEC-083): the landing page at the base, the game at play/.
      - run: npm run build
      # Throwaway rendering prototype (DEC-050), published unlinked at /spike-hub/
      # for checks on a real phone. Built after the app so it is never precached.
      - run: npx vite build --config spikes/hub/vite.config.ts --outDir ../../dist/spike-hub --emptyOutDir
      - name: Site layout and landing-page budget
        run: |
          for f in index.html sw.js og.png play/index.html play/sw.js play/manifest.webmanifest spike-hub/index.html; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          # Landing HTML + CSS + JS, gzipped, excluding images: at most 60 KB.
          size=$(cat dist/index.html dist/assets/index-*.css dist/assets/index-*.js | gzip -9 | wc -c)
          echo "landing page: $size bytes gzipped"
          test "$size" -le 61440
      - name: Playwright browsers (cached)
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # Deploy main to GitHub Pages (DEC-064): the landing page at the base, the game
  # at play/, the hub spike at spike-hub/ (DEC-083), all from the web-dist artifact.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [rust, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
